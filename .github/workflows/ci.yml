name: ci

# Fast regression CI. The formal freeze campaign and real storage-fault
# artifacts live in b1-freeze-campaign.yml; this workflow checks ordinary
# deterministic/property regressions and repository provenance on every PR/main
# update. It never connects to an IB Gateway.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gate B1 PASS validation must prove that signed_off_commit is an
          # ancestor of the metadata-only attestation commit and inspect their
          # diff. A depth-1 checkout cannot prove that relation.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned environment from the lockfile
        run: uv sync --locked --extra dev --extra ib

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Byte-compile every source file
        run: uv run python -m compileall -q src tests scripts

      - name: Deterministic suite
        run: uv run pytest -m "not property" --junitxml=deterministic.xml

      - name: Generated tests, default profile
        run: uv run pytest -m property --junitxml=property_default.xml

      - name: STATE.json describes this worktree
        run: uv run python -m ib_execution.provenance --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: "*.xml"
