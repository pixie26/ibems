name: ci

# Fast regression CI. The formal freeze campaign and real storage-fault
# artifacts live in b1-freeze-campaign.yml; this workflow checks ordinary
# deterministic/property regressions and repository provenance on every PR/main
# update. It never connects to an IB Gateway.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR run otherwise checks out GitHub's synthetic merge ref. B2
          # candidate evidence must exercise the exact candidate commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Gate B1 PASS validation must prove that signed_off_commit is an
          # ancestor of the metadata-only attestation commit and inspect their
          # diff. A depth-1 checkout cannot prove that relation.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned environment from the lockfile
        run: uv sync --locked --extra dev --extra ib

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Byte-compile every source file
        run: uv run python -m compileall -q src tests scripts

      # JUnit files are runtime artifacts. Put them below artifacts/ (gitignored)
      # so the exact-freeze attestation can inspect the real worktree rather than
      # CI-generated root files. Otherwise a valid PASS is falsely rejected as
      # a dirty attestation checkout.
      - name: Prepare CI artifact directory
        run: mkdir -p artifacts/ci

      - name: Record exact checkout identity
        run: uv run python scripts/write_ci_checkout_identity.py --output artifacts/ci/checkout-identity.json

      - name: Deterministic suite
        run: uv run pytest -m "not property" --junitxml=artifacts/ci/deterministic.xml

      - name: Generated tests, default profile
        run: uv run pytest -m property --junitxml=artifacts/ci/property_default.xml

      - name: STATE.json describes this worktree
        run: uv run python -m ib_execution.provenance --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/ci/*.xml
            artifacts/ci/checkout-identity.json

  windows-verify:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned environment
        run: uv sync --locked --extra dev --extra ib

      - name: Prepare Windows CI artifact directory
        shell: powershell
        run: New-Item -ItemType Directory -Force artifacts/ci | Out-Null

      - name: Record exact checkout identity
        run: uv run python scripts/write_ci_checkout_identity.py --output artifacts/ci/checkout-identity.json

      # Keep native commands in separate Actions steps. Windows PowerShell does
      # not reliably stop a multiline block merely because an external process
      # set a non-zero exit code; a later successful command can otherwise mask
      # a failed pytest invocation. Separate steps preserve each native exit code.
      - name: Byte-compile every source file on Windows
        run: uv run python -m compileall -q src tests scripts

      - name: Complete Windows test suite
        run: uv run pytest --junitxml=artifacts/ci/windows-full.xml

      - name: STATE.json describes this Windows worktree
        run: uv run python -m ib_execution.provenance --check

      - name: Run safe real-NTFS publication and process drills
        run: >-
          uv run python scripts/run_windows_ntfs_safe_drill.py
          --root artifacts/windows_ntfs_safe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-platform-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/ci/windows-full.xml
            artifacts/windows_ntfs_safe/**
          if-no-files-found: error
