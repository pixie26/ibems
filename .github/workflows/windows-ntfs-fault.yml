name: windows-ntfs-fault

# Order-capable Windows evidence is deliberately separate from ordinary CI.
# The job creates and formats only a new disposable VHD under artifacts/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-ntfs-faults:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned environment
        run: uv sync --locked --extra dev --extra ib

      - name: Safe NTFS ownership and publication drills
        run: >-
          uv run python scripts/run_windows_ntfs_safe_drill.py
          --root artifacts/windows_ntfs_safe

      # wal_corruption then disk_full, on one disposable VHD. disk_full is last
      # because it consumes the whole volume and only returns the space in a
      # `finally`. fsync_stall is excluded: Windows has no dm-delay equivalent.
      - name: Isolated VHD real NTFS fault drills
        shell: powershell
        run: scripts/run_windows_ntfs_vhd_disk_full.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ntfs-fault-${{ github.sha }}
          path: |
            artifacts/windows_ntfs_safe/**
            artifacts/windows_ntfs_vhd/**
          if-no-files-found: error
          retention-days: 90
