name: agent-recovery-p0-bootstrap

on:
  push:
    branches: [agent/recovery-p0-unified]

permissions:
  contents: write

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact P0 recovery patch
        run: python scripts/_agent_apply_recovery_p0_v2.py

      # Remove bootstrap-only files before provenance is generated. scripts/*.py
      # participates in source_tree_sha256, so leaving the patcher present here
      # would manufacture a STATE.json for a tree different from the PR tree.
      - name: Remove bootstrap-only files
        run: |
          rm scripts/_agent_apply_recovery_p0.py
          rm scripts/_agent_apply_recovery_p0_v2.py
          rm .github/workflows/agent-recovery-p0-bootstrap.yml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned environment
        run: uv sync --locked --extra dev --extra ib

      - name: Regenerate machine provenance for the final tree
        run: uv run python -m ib_execution.provenance

      - name: Compile source and tests
        run: uv run python -m compileall -q src tests scripts

      - name: Recovery P0 targeted regressions
        run: >-
          uv run pytest -q
          tests/test_recovery_p0_regressions.py
          tests/test_market_liveness.py

      # main@f804e3b already fails Linux collection in this unrelated file
      # (ModuleNotFoundError: scripts) while its Windows full suite passes.
      # Exclude exactly that known baseline defect here so this branch can still
      # prove the recovery change against the rest of the Linux suite. The real
      # PR CI is left unchanged and will continue to expose the baseline red.
      - name: Affected deterministic regression excluding known main baseline defect
        run: >-
          uv run pytest -m "not property" -q
          --ignore=tests/test_gateway_detection.py

      - name: Affected property regression excluding known main baseline defect
        run: >-
          uv run pytest -m property -q
          --ignore=tests/test_gateway_detection.py

      - name: Verify machine provenance
        run: uv run python -m ib_execution.provenance --check

      - name: Show intended diff only
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit verified P0 fix
        run: |
          git config user.name "openai-agent"
          git config user.email "noreply@openai.com"
          git add -A -- \
            src/ib_execution/quote_recorder.py \
            src/ib_execution/market_liveness.py \
            tests/test_recovery_p0_regressions.py \
            docs/INCIDENT_FULL_RTH_20260812_ZH.md \
            docs/GATE_B2_STATUS_20260810_ZH.md \
            STATE.json \
            scripts/_agent_apply_recovery_p0.py \
            scripts/_agent_apply_recovery_p0_v2.py \
            .github/workflows/agent-recovery-p0-bootstrap.yml
          git diff --cached --check
          git commit -m "Fix recorder recovery escalation"
          git push origin HEAD:agent/recovery-p0-unified
