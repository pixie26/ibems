name: recorder-soak

# Heavy synthetic raw-capture validation is intentionally separate from PR CI.
# It writes and reads one million events on both supported development OSes.
on:
  schedule:
    - cron: "17 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned environment
        run: uv sync --locked --extra dev --extra ib

      - name: Run one-million-event Recorder soak
        run: >-
          uv run python scripts/run_recorder_soak.py
          --root artifacts/recorder_soak
          --events 1000000
          --target-rate 10000
          --max-writer-lag-ms 5000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorder-soak-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/recorder_soak/**
          if-no-files-found: error
          retention-days: 30
